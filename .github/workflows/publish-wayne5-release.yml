name: Publish Wayne 1.2.2-wayne.5 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-wayne5-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.2.2-wayne.5
      APK_PATH: downloads/life-dashboard-companion-1.2.2-wayne.5-release.apk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release and upload signed APK
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --verify-tag \
              --title "Life Dashboard Companion 1.2.2-wayne.5" \
              --notes-file RELEASE_NOTES_WAYNE_1.2.2.md
          fi
